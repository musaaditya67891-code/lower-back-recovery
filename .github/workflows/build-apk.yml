name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          rm -rf /tmp/recovery-build
          flutter create \
            --platforms=android \
            --org com.musaaditya \
            --project-name lower_back_recovery \
            /tmp/recovery-build
          rm -rf /tmp/recovery-build/lib /tmp/recovery-build/test
          cp -R lib /tmp/recovery-build/lib
          cp pubspec.yaml analysis_options.yaml /tmp/recovery-build/
          mkdir -p /tmp/recovery-build/tool
          cp tool/prepare_android.py /tmp/recovery-build/tool/

      - name: Prepare Android notification support
        working-directory: /tmp/recovery-build
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        working-directory: /tmp/recovery-build
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/recovery-build
        run: flutter analyze

      - name: Build release APK
        working-directory: /tmp/recovery-build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lower-back-recovery-apk
          path: /tmp/recovery-build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
